<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulador SOLI</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <main>
    <h1>Simulador de hardware SOLI</h1>
    <p class="ayuda">
      Cada boton hace lo mismo que el aparato real: un <code>POST /solicitudes</code>
      con el motivo y la mesa. Tambien podes usar las teclas 1 a 6.
    </p>

    <section class="config">
      <label>
        API
        <input id="api" type="url" />
      </label>
      <label>
        Mesa
        <select id="mesa"></select>
      </label>
      <button id="recargar" type="button">Recargar mesas</button>
    </section>

    <!-- el aparato: una cajita con su led y los 6 botones -->
    <section class="aparato">
      <div class="cabeza">
        <span id="led" class="led"></span>
        <span id="pantallita">Elegi una mesa</span>
      </div>
      <div id="botones" class="botones"></div>
    </section>

    <section>
      <h2>Lo que se mando</h2>
      <ul id="registro" class="registro"></ul>
    </section>
  </main>

  <script src="simulador.js"></script>
</body>
</html>
